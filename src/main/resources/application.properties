spring.application.name=esientradas

esiusuarios.base-url=${ESIUSUARIOS_URL}
stripe.api-key=${STRIPE_KEY}
correo.username=${GMAIL_ACC}
correo.password=${GMAIL_PSWD}


spring.datasource.url = jdbc:mysql://localhost:3306/esientradas?serverTimezone=UTC&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&maxAllowedPacket=134217728
spring.datasource.username = root
spring.datasource.password = root

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto = update
spring.jpa.open-in-view = false

server.error.include-message=always

# --- Configuración para mantener la terminal limpia ---
spring.jpa.properties.hibernate.generate_statistics=false
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR